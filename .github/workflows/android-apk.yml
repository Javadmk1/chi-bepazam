name: Build Android test APK

concurrency:
  group: android-apk-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Verify Expo native dependency versions
        run: npx expo install --check

      - name: Check Supabase build configuration
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase secrets are not configured; app will run in offline-only mode."
          else
            echo "Supabase public client configuration is present."
          fi

      - name: Fix expo-font publication metadata
        run: node scripts/fix-expo-font-publication.mjs

      - name: Fetch openly licensed recipe photos
        id: recipe_photos
        timeout-minutes: 2
        continue-on-error: true
        run: node scripts/fetch-recipe-images.mjs

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Diagnose Expo autolinking metadata
        run: node scripts/diagnose-expo-autolinking.mjs

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chi-bepazam-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            assets/recipes/ATTRIBUTION.txt
            assets/recipes/image-fetch-report.json
          if-no-files-found: error
          retention-days: 14
