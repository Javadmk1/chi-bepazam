name: Build Android test APK

concurrency:
  group: android-apk-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install Gradle itself before entering the Android build. This bypasses
      # the generated wrapper's hard-coded 10s distribution download timeout.
      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"

      - name: Install dependencies
        timeout-minutes: 10
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Verify Expo native dependency versions
        run: npx expo install --check

      - name: Check Supabase build configuration
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase secrets are not configured; app will run in offline-only mode."
          else
            echo "Supabase public client configuration is present."
          fi

      - name: Fix expo-font publication metadata
        run: node scripts/fix-expo-font-publication.mjs

      - name: Fetch openly licensed recipe photos
        id: recipe_photos
        timeout-minutes: 2
        continue-on-error: true
        run: node scripts/fetch-recipe-images.mjs

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Diagnose Expo autolinking metadata
        run: node scripts/diagnose-expo-autolinking.mjs

      - name: Verify installed Gradle version
        run: |
          gradle --version
          test "$(gradle --version | awk '/^Gradle / {print $2; exit}')" = "8.14.3"

      - name: Build installable debug APK
        timeout-minutes: 35
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chi-bepazam-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            assets/recipes/ATTRIBUTION.txt
            assets/recipes/image-fetch-report.json
          if-no-files-found: error
          retention-days: 14
